<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finanças da Casa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: coluna única de celular, painel primeiro (resumo antes do detalhe), barra de abas fixa embaixo e botão de lançar sempre à mão. */
/* Direção: sítio ao amanhecer. Verde-pinheiro como acento, madeira/sol para os sonhos, céu e morros nas ilustrações de progresso. */
:root{
  --bg:#EEF2EA; --surface:#FFFFFF; --ink:#1D2A22; --muted:#5D6B61; --line:#D8E0D2; --accent:#2E6B45; --accent-soft:#DDEBDC;
  --wood:#B07A34; --wood-soft:#F3E6D0; --sky:#DCEBEF; --sky2:#F5EEDC; --hill1:#A9C79A; --hill2:#7FA672; --roof:#3E5B3E; --stone:#B4AFA3; --glow:#F2C55C;
  --essencial:#4E6E8E; --escolha:#C08A2C; --evitavel:#B4492F; --futuro:#2E8B57; --transf:#8A938E; --entrada:#2E6B45;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:16px; --shadow:0 1px 2px rgba(29,42,34,.05), 0 6px 18px rgba(29,42,34,.06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1511; --surface:#17201A; --ink:#E6EDE7; --muted:#9AA79E; --line:#29352D; --accent:#7CC59A; --accent-soft:#1D3325;
    --wood:#E0AE5E; --wood-soft:#33291A; --sky:#1A2A33; --sky2:#2A2A22; --hill1:#2E4A35; --hill2:#25402C; --roof:#8FB58B; --stone:#6F6C64; --glow:#F2C55C;
    --essencial:#8FB0D3; --escolha:#E0AE5E; --evitavel:#EE7C62; --futuro:#6CCB93; --transf:#7E8984; --entrada:#7CC59A;
    --shadow:none; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1511; --surface:#17201A; --ink:#E6EDE7; --muted:#9AA79E; --line:#29352D; --accent:#7CC59A; --accent-soft:#1D3325;
  --wood:#E0AE5E; --wood-soft:#33291A; --sky:#1A2A33; --sky2:#2A2A22; --hill1:#2E4A35; --hill2:#25402C; --roof:#8FB58B; --stone:#6F6C64; --glow:#F2C55C;
  --essencial:#8FB0D3; --escolha:#E0AE5E; --evitavel:#EE7C62; --futuro:#6CCB93; --transf:#7E8984; --entrada:#7CC59A;
  --shadow:none; color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:540px;margin:0 auto;padding:0 16px 120px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:16px 0 8px}
.brand{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.01em}
.mes{display:flex;align-items:center;gap:4px}
.mes button{border:1px solid var(--line);background:var(--surface);width:34px;height:34px;border-radius:10px;display:grid;place-items:center}
.mes span{min-width:118px;text-align:center;font-weight:600;text-transform:capitalize;font-size:14px}
.banner{font-size:13px;padding:10px 12px;border-radius:10px;background:var(--accent-soft);color:var(--ink);margin:4px 0 8px}
.banner.warn{background:color-mix(in srgb,var(--escolha) 18%,var(--surface))}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card h2{font-family:var(--display);font-weight:600;font-size:16px;margin:0 0 10px;text-wrap:balance}
.card h2 small{font-family:var(--body);font-weight:500;color:var(--muted);font-size:13px;margin-left:6px}
.hero .lbl{color:var(--muted);font-size:13px;font-weight:600}
.hero .big{font-family:var(--display);font-weight:700;font-size:38px;letter-spacing:-.02em;line-height:1.1;margin:2px 0 6px}
.pos{color:var(--futuro)} .neg{color:var(--evitavel)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.muted{color:var(--muted)} .small{font-size:13px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.split div{background:var(--bg);border-radius:10px;padding:10px 12px}
.split b{display:block;font-size:17px}
.bar100{display:flex;height:22px;border-radius:7px;overflow:hidden;background:var(--bg);margin:6px 0 12px}
.bar100 i{display:block;height:100%}
.legend{display:grid;grid-template-columns:1fr;gap:6px}
.legend .it{display:grid;grid-template-columns:12px 1fr auto auto;gap:8px;align-items:center;font-size:14px}
.legend .it em{font-style:normal;color:var(--muted);font-size:12px;min-width:58px;text-align:right}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap}
.n-E{--c:var(--essencial)} .n-C{--c:var(--escolha)} .n-V{--c:var(--evitavel)} .n-F{--c:var(--futuro)} .n-T{--c:var(--transf)} .n-R{--c:var(--entrada)}
.pill.n{color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.evit .big{font-family:var(--display);font-weight:700;font-size:30px;color:var(--evitavel);line-height:1.1}
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.li:first-child{border-top:0}
.li .t{font-weight:600;overflow-wrap:anywhere}
.li .s{font-size:12.5px;color:var(--muted);grid-column:1}
.li .v{font-weight:700;text-align:right;grid-row:1/3;grid-column:2}
button.li{background:none;border:0;border-top:1px solid var(--line);text-align:left;width:100%;padding:10px 0}
button.li:first-child{border-top:0}
.catbar{display:grid;gap:4px;padding:8px 0;border-top:1px solid var(--line)}
.catbar:first-child{border-top:0}
.track{height:8px;border-radius:5px;background:var(--bg);overflow:hidden}
.track i{display:block;height:100%;border-radius:5px;background:var(--accent)}
.btn{border:0;border-radius:11px;padding:11px 16px;font-weight:700;background:var(--accent);color:var(--surface)}
:root[data-theme="dark"] .btn{color:#0F1513}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--evitavel);border:1px solid var(--line)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}
.btn.full{width:100%}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.steps{counter-reset:s;display:grid;gap:10px;margin:0;padding:0;list-style:none}
.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.steps li::before{content:counter(s);width:26px;height:26px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-weight:800;display:grid;place-items:center;font-size:13px}
.ai{white-space:pre-wrap;font-size:14px;background:var(--bg);border-radius:10px;padding:12px;margin-top:10px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:20}
nav.tabs .in{max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;text-decoration:none;color:var(--muted);font-size:10.5px;font-weight:600;border-radius:10px;position:relative}
nav.tabs a svg{width:22px;height:22px}
nav.tabs a[aria-current="page"], nav.tabs a.sub{color:var(--accent);background:var(--accent-soft)}
.badge{position:absolute;top:2px;right:calc(50% - 22px);background:var(--evitavel);color:#fff;font-size:10px;font-weight:800;border-radius:99px;padding:1px 6px}
.fab{position:fixed;right:max(16px,calc(50% - 254px));bottom:calc(78px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:18px;border:0;background:var(--accent);color:var(--surface);box-shadow:0 6px 20px rgba(14,90,80,.35);display:grid;place-items:center;z-index:21}
.fab svg{width:28px;height:28px}
.sheet-bg{position:fixed;inset:0;background:rgba(10,16,14,.45);z-index:40;display:none}
.sheet-bg.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92%;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;z-index:41;transform:translateY(105%);transition:transform .22s ease;padding:8px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet.on{transform:none}
@media (prefers-reduced-motion: reduce){.sheet{transition:none}}
.sheet .in{max-width:540px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:4px auto 0}
.sheet h3{font-family:var(--display);margin:0;font-size:19px}
.fld{display:flex;flex-direction:column;gap:6px}
.fld>label,.fld>.lab{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.inp{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:11px;padding:11px 12px}
.valor{font-family:var(--display);font-size:32px;font-weight:700;border:0;border-bottom:2px solid var(--line);background:transparent;border-radius:0;padding:4px 0;width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 12px;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#0F1513}
.chip.mot{border-radius:11px;text-align:left}
.chip.mot .pill{font-size:10.5px;padding:1px 6px}
.chip[aria-pressed="true"] .pill{background:rgba(255,255,255,.22);color:inherit}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 4px;font-size:12.5px;font-weight:700;color:var(--c)}
.seg button[aria-pressed="true"]{background:var(--c);color:var(--surface);border-color:var(--c)}
.tog{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:12px;padding:4px}
.tog button{border:0;background:transparent;padding:9px;border-radius:9px;font-weight:700;color:var(--muted)}
.tog button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1}
.pend{display:grid;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.pend:first-child{border-top:0}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.filters .chip{flex:none}
.day{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:12px 0 2px}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
svg.chart text{fill:var(--muted);font-size:11px;font-family:var(--body)}
.drop{border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--muted);font-size:14px}
details.how summary{cursor:pointer;font-weight:700}
details.how ol{padding-left:20px;margin:8px 0 0;display:grid;gap:4px;font-size:14px}
.status{font-size:12px;font-weight:700}
.st-ok{color:var(--futuro)} .st-late{color:var(--evitavel)} .st-soon{color:var(--escolha)} .st-wait{color:var(--muted)}
.hidden{display:none!important}
.pin-gate{position:fixed;inset:0;background:var(--bg);z-index:100;display:grid;place-items:center;padding:24px}
.pin-box{width:100%;max-width:320px;display:grid;gap:12px;justify-items:center;text-align:center}
.pill-ok{color:var(--futuro);background:color-mix(in srgb,var(--futuro) 14%,transparent)} .pill-no{color:var(--evitavel);background:color-mix(in srgb,var(--evitavel) 14%,transparent)}
.dream{padding:0;overflow:hidden}
.dream .scene{display:block;width:100%;height:auto;background:var(--sky)}
.dream .body{padding:14px 16px 16px;display:grid;gap:8px}
.dream .pct{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;color:var(--wood)}
.dream h2{margin:0;font-size:18px}
.wbar{height:12px;border-radius:8px;background:var(--wood-soft);overflow:hidden}
.wbar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--wood),var(--glow))}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--wood)}
.btn.wood{background:var(--wood);color:#fff}
:root[data-theme="dark"] .btn.wood{color:#1A140A}
.mini-dreams{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.mini{background:var(--bg);border-radius:12px;padding:10px 12px;display:grid;gap:6px;text-decoration:none;color:inherit}
.mini b{font-size:14px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
</style>

<link rel="apple-touch-icon" href="icon-512.png">
<link rel="icon" href="icon-192.png">

<body>
<div class="app">
  <header class="top">
    <div class="brand">Finanças da Casa</div>
    <div class="mes" aria-label="Mês">
      <button id="mPrev" aria-label="Mês anterior"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 6l-6 6 6 6"/></svg></button>
      <span id="mLabel" class="num">—</span>
      <button id="mNext" aria-label="Próximo mês"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
  </header>
  <div id="banner"></div>
  <main id="view" class="stack"></main>
</div>

<button class="fab" id="fab" aria-label="Lançar gasto ou entrada"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>

<nav class="tabs" aria-label="Seções"><div class="in">
  <a href="#painel" data-tab="painel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/></svg>Início</a>
  <a href="#sonhos" data-tab="sonhos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 20l7-12 4 6 2-3 5 9z"/><circle cx="17" cy="6" r="2"/></svg>Sonhos</a>
  <a href="#cartao" data-tab="cartao"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 10h19M6.5 15h4"/></svg>Cartão</a>
  <a href="#classificar" data-tab="classificar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h10M4 18h7"/><path d="M16 16l2 2 4-4"/></svg>Classificar<span class="badge hidden" id="badge">0</span></a>
  <a href="#extrato" data-tab="extrato"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h7"/></svg>Extrato</a>
  <a href="#ajustes" data-tab="ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Ajustes</a>
</div></nav>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="grab"></div><div class="in" id="sheetIn"></div></div>
<div class="toast" id="toast" role="status"></div>
<div id="pinGate" class="pin-gate hidden"><div class="pin-box">
  <svg viewBox="0 0 120 70" width="120" height="70" aria-hidden="true"><path d="M0 60 Q30 38 60 52 T120 48 V70 H0Z" fill="var(--hill2)"/><path d="M40 58 L60 22 L80 58 L74 58 L60 32 L46 58Z" fill="var(--roof)"/><rect x="52" y="44" width="16" height="14" fill="var(--glow)"/><circle cx="98" cy="18" r="8" fill="var(--glow)" opacity=".8"/></svg>
  <h3 id="pinTitle" style="margin:0;font-family:var(--display);font-size:22px">Finanças da Casa</h3>
  <p id="pinMsg" class="small muted" style="margin:0">Digite o PIN da casa</p>
  <input id="pinInp" class="inp num" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off" style="text-align:center;font-size:28px;letter-spacing:.4em">
  <button class="btn full" id="pinBtn">Entrar</button>
</div></div>
<input type="file" id="fileInp" accept=".ofx,.OFX,.csv,.CSV,.txt" class="hidden">

<script>
"use strict";
const EXEC = "https://script.google.com/macros/s/AKfycbxWJXbOmmx9sU4ZAx2O0l9mFKFmCbFPEd13DVHIdLfbuk9TGZKHHNEJ--qRyalF3jUk/exec";
const URL_APP = location.origin + location.pathname;
const ALVO = (new URLSearchParams(location.search).get("t")||"").replace(/[^A-Za-z0-9_\-.~:@+]/g,"");
if (location.search) { try { history.replaceState(null, "", URL_APP + location.hash); } catch(e) {} }
const GAS = true;
let PIN = ""; try { PIN = localStorage.getItem("fc-pin") || ""; } catch(e) {}
const run = (acao,p)=>fetch(EXEC,{method:"POST",redirect:"follow",credentials:"omit",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({pin:PIN,acao,p:{...(p||{}),_app:URL_APP}})})
  .then(r=>{ if(!r.ok) throw new Error("Sem conexão com o servidor ("+r.status+")"); return r.json(); })
  .then(j=>{ if(!j.ok) throw new Error(j.erro); return j.r; });
/* ---------- Catálogo de motivos ---------- */
const NAT = {
  E:{nome:"Essencial", dica:"precisava"},
  C:{nome:"Escolha", dica:"escolhi, cabe no plano"},
  V:{nome:"Evitável", dica:"dava para não ter gasto"},
  F:{nome:"Sonhos", dica:"guardei para os nossos sonhos"},
  T:{nome:"Transferência", dica:"entre contas, não entra na conta"},
  R:{nome:"Entrada", dica:"dinheiro que entrou"}
};
const CATS = [
 {id:"moradia",nome:"Moradia",m:[["aluguel","Aluguel / financiamento","E"],["condominio","Condomínio","E"],["energia","Energia","E"],["agua","Água","E"],["internet","Internet / TV","E"],["gas","Gás","E"],["terreno","Terreno","E"],["manut-casa","Manutenção da casa","E"],["mobilia","Mobília / eletrônicos casa","C"],["casa-extra","Item para casa (sem urgência)","C"]]},
 {id:"mercado",nome:"Mercado",m:[["compra-mes","Compra do mês","E"],["reposicao","Reposição da semana","E"],["superfluo","Supérfluos no mercado","V"]]},
 {id:"fora",nome:"Comer fora",m:[["delivery","Delivery / iFood","V"],["lanche","Lanche ou café na rua","V"],["restaurante","Restaurante em família","C"],["refeicao-trab","Refeição no trabalho","E"]]},
 {id:"transporte",nome:"Transporte",m:[["combustivel","Combustível","E"],["manut-carro","Manutenção do carro","E"],["financ-carro","Financiamento do carro","E"],["ipva","IPVA / seguro","E"],["pedagio","Pedágio / estacionamento","E"],["app-transp","Uber / 99 por conveniência","V"],["multa","Multa de trânsito","V"]]},

/* ---------- Armazenamento: banco compartilhado (db) ou local ---------- */
const Store = {
  db:null,
  async init(){
    if(GAS) return GasStore.init();
    let db=null;
    try{ if(window.claude&&window.claude.use){ db = await Promise.race([window.claude.use("db"), new Promise(r=>setTimeout(()=>r(null),10000))]); } }catch(e){db=null;}
    if(db){ this.db=db; S.modo="compartilhado"; this.listen(); try{const u=await window.claude.use("user"); if(u){const c=await u.can("data.write"); if(c===false)S.podeEscrever=false;}}catch(e){} }
    else { S.modo="local"; this.loadLocal(); render(); }
  },
  listen(){
    let pend=5; const timer=setTimeout(()=>{ if(pend>0){ setBanner("Ainda não consegui carregar os dados. Verifique a internet; o app tenta de novo sozinho.","warn"); } },10000);
    const done=snap=>{ if(snap&&snap.metadata&&!snap.metadata.fromCache){ pend=Math.max(0,pend-1); if(pend===0){clearTimeout(timer); setBanner("");} } };
    const err=e=>{ clearTimeout(timer); setBanner("Não foi possível acessar os dados compartilhados ("+esc(e.code)+").","warn"); };
    const col=(name,key)=>this.db.collection(name).onSnapshot(snap=>{ S[key]=new Map(snap.docs.map(d=>[d.id,d.data()])); done(snap); render(); },err);
    col("lanc","lanc"); col("contas","contas"); col("regras","regras"); col("metas","metas");
    this.db.doc("config/geral").onSnapshot(d=>{ S.cfg=d.exists?d.data():null; done(d); render(); },err);
  },
  loadLocal(){
    try{ const raw=JSON.parse(localStorage.getItem("financas-casa-v1")||"{}");
      S.lanc=new Map(Object.entries(raw.lanc||{})); S.contas=new Map(Object.entries(raw.contas||{})); S.regras=new Map(Object.entries(raw.regras||{})); S.metas=new Map(Object.entries(raw.metas||{})); S.cfg=raw.cfg||null;
    }catch(e){}
  },
  saveLocal(){
    try{ localStorage.setItem("financas-casa-v1",JSON.stringify({lanc:Object.fromEntries(S.lanc),contas:Object.fromEntries(S.contas),regras:Object.fromEntries(S.regras),metas:Object.fromEntries(S.metas),cfg:S.cfg})); }catch(e){}
  },
  async set(col,id,data){
    if(GAS) return GasStore.set(col,id,data);
    if(this.db){
      const ref = col==="config"? this.db.doc("config/"+id) : this.db.collection(col).doc(id);
      try{ await ref.set(data); }
      catch(e){
        if(e&&e.code==="unavailable"||e&&e.code==="resource_exhausted"){ await new Promise(r=>setTimeout(r,1200+Math.random()*800)); await ref.set(data); }
        else if(e&&e.code==="invalid_argument"){ S.podeEscrever=false; throw new Error("Sem permissão para salvar. Peça ao Rodrigo para compartilhar como Colaborador."); }
        else if(e&&e.code==="quota_exceeded"){ throw new Error("O espaço de dados encheu. Apague lançamentos antigos em Ajustes."); }
        else throw e;
      }
    } else {
      if(col==="config") S.cfg=data; else S[col].set(id,data);
      this.saveLocal(); render();
    }
  },
  async del(col,id){
    if(GAS) return GasStore.del(col,id);
    if(this.db){ await this.db.collection(col).doc(id).delete(); }
    else { S[col].delete(id); this.saveLocal(); render(); }
  }
};

    }

    await run("set",{col:c,id,data});

function setBanner(msg,kind){ const b=$("#banner"); b.innerHTML = msg? '<div class="banner '+(kind||"")+'">'+msg+'</div>' : ""; }

/* ---------- Cálculos ---------- */
function doMes(m){ return [...S.lanc.entries()].map(([id,d])=>({id,...d})).filter(l=>l.mes===m && l.status!=="pendente"); }
function resumo(m){
  const ls=doMes(m); const r={ent:0,E:0,C:0,V:0,F:0,T:0,porCat:{},porMot:{},porPessoa:{},n:ls.length};
  ls.forEach(l=>{
    const v=+l.valor||0;
    if(l.tipo==="entrada"){ if(l.nat==="T") r.T+=v; else r.ent+=v; return; }
    const n=l.nat||"E"; r[n]=(r[n]||0)+v;
    if(n==="T") return;
    if(n!=="F"){ r.porCat[l.cat]=(r.porCat[l.cat]||0)+v; r.porPessoa[l.pessoa||"casa"]=(r.porPessoa[l.pessoa||"casa"]||0)+v; }
    const k=l.motivo||"?"; if(!r.porMot[k]) r.porMot[k]={v:0,n:0,nat:n}; r.porMot[k].v+=v; r.porMot[k].n++;
  });
  r.gastos=r.E+r.C+r.V; r.saldo=r.ent-r.gastos; r.livre=r.saldo-r.F;
  return r;
}
function pendentes(){ return [...S.lanc.entries()].map(([id,d])=>({id,...d})).filter(l=>l.status==="pendente").sort((a,b)=>b.data.localeCompare(a.data)); }
function contasDoMes(m){
  const dm=diasNoMes(m), hj=hoje();
  return [...S.contas.entries()].map(([id,c])=>{
    const dia=Math.min(+c.dia||1,dm); const venc=m+"-"+pad(dia); const pago=!!(c.pagos&&c.pagos[m]);
    const dias=Math.round((new Date(venc)-new Date(hj))/864e5);
    let st="wait",txt="vence dia "+pad(dia);
    if(pago){st="ok";txt="paga";} else if(dias<0){st="late";txt="atrasada "+(-dias)+(dias===-1?" dia":" dias");} else if(dias<=5){st="soon";txt=dias===0?"vence hoje":"vence em "+dias+(dias===1?" dia":" dias");}
    return {id,...c,venc,pago,dias,st,txt};
  }).sort((a,b)=>a.venc.localeCompare(b.venc));
}

  /* meta */
  if(c.meta>0){ const p=Math.max(0,Math.min(1,(r.F+Math.max(0,r.livre))/c.meta)); const guard=r.F+Math.max(0,r.livre);
    h+=`<div class="card"><h2>Meta de economia <small>${brl0(c.meta)} por mês</small></h2><div class="track" style="height:12px"><i style="width:${p*100}%;background:var(--futuro)"></i></div>
    <div class="row small" style="margin-top:6px"><span class="muted">Guardado + livre</span><b class="num">${brl0(guard)} · ${Math.round(p*100)}%</b></div></div>`; }

  /* contas */
  const cs=contasDoMes(m); const abertas=cs.filter(x=>!x.pago);
  if(cs.length){ const tot=abertas.reduce((s,x)=>s+(+x.valor||0),0);
    h+=`<div class="card"><h2>Contas fixas <small>${abertas.length} em aberto · ${brl0(tot)}</small></h2><div class="list">${cs.filter(x=>!x.pago).slice(0,4).map(x=>`<div class="li"><span class="t">${esc(x.nome)}</span><span class="s status st-${x.st}">${x.txt}</span><span class="v num">${brl(+x.valor)}</span></div>`).join("")||'<div class="empty">Tudo pago neste mês.</div>'}</div>
    <div class="btns" style="margin-top:8px"><a class="btn sm ghost" href="#contas" style="text-decoration:none">Ver todas</a></div></div>`; }

  /* atalho cartão */
  h+=cartaoAtalho(m);
  /* categorias */
  const cats=Object.entries(r.porCat).sort((a,b)=>b[1]-a[1]);
  if(cats.length){ const mx=Math.max(...cats.map(x=>x[1]),...cats.map(([k])=>c.tetos[k]||0));
    h+=`<div class="card"><h2>Por categoria</h2>${cats.map(([k,val])=>{const t=+c.tetos[k]||0; const pc=t?val/t:0; const cor=t?(pc>=1?"var(--evitavel)":pc>=.8?"var(--escolha)":"var(--accent)"):"var(--accent)";
      return `<div class="catbar"><div class="row"><span style="font-weight:600">${esc((CAT[k]||{}).nome||k)}</span><span class="num small"><b>${brl0(val)}</b>${t?` <span class="muted">de ${brl0(t)}</span>`:""}</span></div><div class="track"><i style="width:${(t?Math.min(1,pc):val/mx)*100}%;background:${cor}"></i></div></div>`;}).join("")}
      <div class="small muted" style="margin-top:6px">Defina limites por categoria em Ajustes.</div></div>`; }

  /* pessoa */
  const pp=Object.entries(r.porPessoa); if(pp.length>1){ const mx=Math.max(...pp.map(x=>x[1]));
    h+=`<div class="card"><h2>Quem gastou</h2>${pp.sort((a,b)=>b[1]-a[1]).map(([k,val])=>`<div class="catbar"><div class="row"><span style="font-weight:600">${esc(pessoaNome(k))}</span><b class="num small">${brl0(val)}</b></div><div class="track"><i style="width:${val/mx*100}%"></i></div></div>`).join("")}</div>`; }

  /* tendência */
  h+=chart6(m);
  v.innerHTML=h;
}

function chart6(m){
  const ms=[]; for(let i=5;i>=0;i--) ms.push(addMes(m,-i));
  const rs=ms.map(x=>resumo(x)); if(rs.every(x=>x.gastos===0&&x.ent===0)) return "";
  const W=500,H=200,pl=8,pr=8,pt=22,pb=40; const mx=Math.max(...rs.map(x=>Math.max(x.ent,x.gastos)),1);
  const bw=(W-pl-pr)/6; const y=v=>pt+(H-pt-pb)*(1-v/mx);
  let g=`<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Entradas e gastos nos últimos 6 meses">`;
  [0.5,1].forEach(f=>{g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(mx*f)}" y2="${y(mx*f)}" stroke="var(--line)" stroke-dasharray="3 4"/>`;});
  g+=`<text x="${pl}" y="${y(mx)-6}">${brl0(mx)}</text>`;
  rs.forEach((r,i)=>{ const x=pl+i*bw+bw*.22, w=bw*.56; let yy=y(0);
    [["E",r.E],["C",r.C],["V",r.V]].forEach(([n,val])=>{ if(val<=0)return; const hh=(H-pt-pb)*val/mx; yy-=hh; g+=`<rect x="${x}" y="${yy}" width="${w}" height="${hh}" fill="var(--${n==="E"?"essencial":n==="C"?"escolha":"evitavel"})" rx="2"/>`; });
    if(r.ent>0) g+=`<line x1="${x-4}" x2="${x+w+4}" y1="${y(r.ent)}" y2="${y(r.ent)}" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/>`;
    g+=`<text x="${x+w/2}" y="${H-pb+15}" text-anchor="middle" style="text-transform:capitalize;${ms[i]===m?"font-weight:800;fill:var(--ink)":""}">${nomeMes(ms[i],true)}</text>`;
    if(r.ent>0||r.gastos>0) g+=`<text x="${x+w/2}" y="${H-pb+30}" text-anchor="middle" style="fill:${r.saldo>=0?"var(--futuro)":"var(--evitavel)"};font-weight:700">${r.saldo>=0?"+":"−"}${Math.abs(Math.round(r.saldo/100)/10).toLocaleString("pt-BR")}k</text>`;
  });
  g+="</svg>";
  return `<div class="card"><h2>Últimos 6 meses</h2>${g}<div class="small muted">Barras: gastos (essencial, escolha, evitável). Traço: o que entrou. Embaixo: saldo do mês.</div></div>`;
}

/* ---------- Sonhos ---------- */
const TIPOS_META={chale:"Chalé",casa:"Casa",terreno:"Terreno",outro:"Outro sonho"};
function metasOrd(){ return [...S.metas.entries()].map(([id,m])=>({id,...m})).sort((a,b)=>(a.ordem||0)-(b.ordem||0)); }
function aportesMeta(m){ return [...S.lanc.values()].filter(l=>l.status!=="pendente"&&l.tipo==="saida"&&(l.meta===m.id||(m.tipo==="terreno"&&l.motivo==="terreno"&&!l.meta))); }
function progresso(m){
  const ap=aportesMeta(m); const guard=(+m.inicial||0)+ap.reduce((s,l)=>s+(+l.valor||0),0);
  const mesAt=mesAtual(); const ult=[0,1,2].map(k=>addMes(mesAt,-k)); const porMes=ult.map(mm=>ap.filter(l=>l.mes===mm).reduce((s,l)=>s+(+l.valor||0),0));
  const media=porMes.reduce((a,b)=>a+b,0)/Math.max(1,porMes.filter((v,i)=>v>0||i===0).length);
  const ritmo=+m.mensal>0?+m.mensal:media; const alvo=+m.alvo||0; const falta=Math.max(0,alvo-guard);
  const meses=ritmo>0&&alvo>0?Math.ceil(falta/ritmo):null;
  return {guard,alvo,falta,p:alvo>0?Math.min(1,guard/alvo):0,ritmo,meses,esteMes:porMes[0]};
}
function scene(tipo,p,uid){
  const W=360,H=170,g=132; const st=x=>p>=x; const plan='stroke="var(--wood)" stroke-width="1.6" stroke-dasharray="4 4" fill="none" opacity=".7"';
  let s=`<svg class="scene" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(TIPOS_META[tipo]||"Sonho")}: ${Math.round(p*100)}% construído"><defs><linearGradient id="sk${uid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--sky)"/><stop offset="1" style="stop-color:var(--sky2)"/></linearGradient></defs>
  <rect width="${W}" height="${H}" fill="url(#sk${uid})"/>
  <circle cx="300" cy="40" r="${14+p*8}" fill="var(--glow)" opacity="${.35+p*.55}"/>
  <path d="M0 ${g-18} Q70 ${g-50} 150 ${g-22} T360 ${g-30} V${H} H0Z" fill="var(--hill1)"/>
  <path d="M0 ${g} Q90 ${g-22} 200 ${g-6} T360 ${g-4} V${H} H0Z" fill="var(--hill2)"/>`;
  const tree=(x,sc)=>`<g transform="translate(${x} ${g-2}) scale(${sc})"><rect x="-2" y="-10" width="4" height="10" fill="var(--wood)"/><path d="M0 -42 L13 -10 H-13Z" fill="var(--roof)"/><path d="M0 -54 L10 -28 H-10Z" fill="var(--roof)"/></g>`;
  s+=tree(36,1)+tree(58,.75)+(st(.35)?tree(318,.9):"")+(st(.6)?tree(338,.7):"");
  const cx=180;
  if(tipo==="terreno"){
    const x0=95,x1=265,y0=g-4,y1=g+22; s+=`<path d="M${x0} ${y0} L${x1} ${y0} L${x1+20} ${y1} L${x0-20} ${y1}Z" fill="var(--wood-soft)" opacity=".7"/>`;
    const N=14; for(let i=0;i<N;i++){ const t=i/(N-1), x=x0-20+t*(x1-x0+40)-0, ok=t<=p+0.001; s+= ok?`<rect x="${x-1.5}" y="${y1-14}" width="3" height="14" fill="var(--wood)"/>`:`<rect x="${x-1.5}" y="${y1-14}" width="3" height="14" ${plan}/>`; }

    s+=`<g transform="translate(${cx} ${g-30})"><rect x="-1.5" y="0" width="3" height="26" fill="var(--wood)"/><rect x="-24" y="-14" width="48" height="16" rx="2" fill="${st(1)?"var(--accent)":"var(--surface)"}" stroke="var(--wood)"/><text x="0" y="-3" text-anchor="middle" font-size="9" font-weight="700" fill="${st(1)?"#fff":"var(--wood)"}" font-family="Manrope,sans-serif">${st(1)?"QUITADO":"NOSSO"}</text></g>`;
  } else if(tipo==="casa"){

    s+= st(.05)?`<rect x="${x-6}" y="${g-4}" width="${w+12}" height="8" fill="var(--stone)"/>`:`<rect x="${x-6}" y="${g-4}" width="${w+12}" height="8" ${plan}/>`;

    if(st(.75)) s+=`<rect x="${cx-9}" y="${g-30}" width="18" height="26" fill="var(--wood)"/><rect x="${x+12}" y="${y+10}" width="20" height="16" fill="var(--glow)"/><rect x="${x+w-32}" y="${y+10}" width="20" height="16" fill="var(--glow)"/>`;
    if(st(.92)) s+=`<path d="M${x-30} ${g+4} q8 -8 16 0 q8 -8 16 0" stroke="var(--accent)" fill="none" stroke-width="2"/>`;
  } else {

    if(st(.75)) s+=`<path d="M${cx-16} ${base-4} L${cx-16} ${base-30} L${cx} ${base-46} L${cx+16} ${base-30} L${cx+16} ${base-4}Z" fill="var(--glow)" opacity=".9"/><line x1="${cx}" y1="${base-46}" x2="${cx}" y2="${base-4}" stroke="var(--wood)" stroke-width="2"/><rect x="${x-14}" y="${base-10}" width="${w+28}" height="4" fill="var(--wood)"/>`;
    if(st(.92)) s+=`<rect x="${cx+22}" y="${base-80}" width="8" height="18" fill="var(--stone)"/><circle cx="${cx+28}" cy="${base-90}" r="5" fill="var(--surface)" opacity=".8"/><circle cx="${cx+36}" cy="${base-102}" r="7" fill="var(--surface)" opacity=".6"/>`;
  }
  return s+"</svg>";

function ehCartao(l){ return /cartao/.test(l.conta||""); }
function itensFatura(m,conta){ return [...S.lanc.entries()].map(([id,d])=>({id,...d})).filter(l=>ehCartao(l)&&(l.fatura||l.mes)===m&&(!conta||l.conta===conta)); }
function projParcelas(m,conta){
  const fut={}; itensFatura(m,conta).forEach(l=>{ const p=l.parcela; if(!p||!(p.total>p.n)||l.tipo==="entrada") return;
    for(let k=1;k<=p.total-p.n;k++){ const mm=addMes(m,k); fut[mm]=(fut[mm]||0)+(+l.valor||0); } });
  return fut;
}
function cartaoAtalho(m){

  /* por categoria */

async function salvarLanc(){

  if(!F.motivo){ toast("Escolha o motivo."); return; }
  const mo=MOT[F.motivo];

/* ---------- Importação OFX / CSV ---------- */
let IMP=null;
function lerArquivo(file){
  return file.arrayBuffer().then(buf=>{ try{ return new TextDecoder("utf-8",{fatal:true}).decode(buf); }catch(e){ return new TextDecoder("windows-1252").decode(buf); } });
}
function parseOFX(txt){
  const isCC=/<CCSTMTRS>/i.test(txt); const out=[];
  const blocos=txt.split(/<STMTTRN>/i).slice(1);
  blocos.forEach(b=>{ b=b.split(/<\/STMTTRN>|<\/BANKTRANLIST>/i)[0];
    const g=t=>{const r=new RegExp("<"+t+">([^<\\r\\n]*)","i").exec(b);return r?r[1].trim():"";};
    const dt=g("DTPOSTED"); let a=g("TRNAMT"); if(a.includes(",")) a=a.replace(/\./g,"").replace(",","."); const amt=parseFloat(a);
    if(dt.length<8||isNaN(amt)||amt===0) return;
    out.push({fitid:g("FITID"),data:dt.slice(0,4)+"-"+dt.slice(4,6)+"-"+dt.slice(6,8),valor:amt,desc:[g("NAME"),g("MEMO")].filter((x,i,arr)=>x&&arr.indexOf(x)===i).join(" · ").replace(/\s+/g," ").trim()});
  });
  return {itens:out,isCC};
}
function parseCSV(txt){
  const linhas=txt.split(/\r?\n/).filter(l=>l.trim()); if(!linhas.length) return {itens:[]};
  const delim=(linhas.slice(0,5).join("").split(";").length>linhas.slice(0,5).join("").split(",").length)?";":",";
  const split=l=>{const r=[];let cur="",q=false;for(const ch of l){if(ch==='"'){q=!q;continue;} if(ch===delim&&!q){r.push(cur.trim());cur="";} else cur+=ch;} r.push(cur.trim()); return r;};
  const rows=linhas.map(split); let hi=-1, iD=-1, iV=-1, iT=[];
  for(let i=0;i<Math.min(rows.length,15);i++){ const n=rows[i].map(norm); const v=n.findIndex(x=>/^valor/.test(x)); if(v>=0){hi=i;iV=v;iD=n.findIndex(x=>/data/.test(x)); iT=n.map((x,j)=>/descri|hist|lancamento|estabelec/.test(x)&&!/data/.test(x)?j:-1).filter(j=>j>=0); break;} }
  const reD=/^(\d{2})\/(\d{2})\/(\d{4})$|^(\d{4})-(\d{2})-(\d{2})/; const reV=/^-?\s*(R\$)?\s*-?[\d.]*\d,\d{2}$|^-?\d+(\.\d{1,2})?$/;
  const out=[];
  rows.slice(hi+1).forEach(r=>{
    let di=iD>=0?iD:r.findIndex(c=>reD.test(c)); if(di<0||!reD.test(r[di]||"")) return;
    let vi=iV>=0?iV:r.findIndex((c,j)=>j!==di&&reV.test(c.replace(/\s/g,""))); if(vi<0) return;
    const m=reD.exec(r[di]); const data=m[3]?m[3]+"-"+m[2]+"-"+m[1]:m[4]+"-"+m[5]+"-"+m[6];
    const valor=parseFloat(r[vi].replace(/R\$|\s/g,"").replace(/\.(?=\d{3}(\D|$))/g,"").replace(",",".")); if(isNaN(valor)||valor===0) return;
    const desc=(iT.length?iT.map(j=>r[j]).filter(Boolean).join(" · "):r.filter((c,j)=>j!==di&&j!==vi&&!reV.test(c.replace(/\s/g,""))).sort((a,b)=>b.length-a.length)[0]||"");
    out.push({fitid:"",data,valor,desc:desc.replace(/\s+/g," ").trim()});
  });
  return {itens:out};
}
async function iniciarImport(file){
  try{
    const txt=await lerArquivo(file); const ehOFX=/<OFX>|OFXHEADER/i.test(txt);
    const res=ehOFX?parseOFX(txt):parseCSV(txt);
    if(!res.itens.length){ toast("Não encontrei lançamentos nesse arquivo. Use OFX ou CSV do extrato."); return; }
    const nm=norm(file.name); let conta=res.isCC?(/inter/.test(nm)?"inter-cartao":"sicredi-cartao"):(/inter/.test(nm)?"inter-cc":"sicredi-cc");
    IMP={itens:res.itens,conta,nome:file.name}; desenhaImport(); abrirSheet();
  }catch(e){ toast("Não consegui ler o arquivo."); }
}
function desenhaImport(){
  const c=cfg(); const ds=IMP.itens.map(i=>i.data).sort(); const sai=IMP.itens.filter(i=>i.valor<0).reduce((s,i)=>s-i.valor,0);
  $("#sheetIn").innerHTML=`<div class="row"><h3 id="sheetTitle">Importar extrato</h3><button class="btn sm ghost" data-act="fechar">Fechar</button></div>
   <div class="banner" style="margin:0"><b>${esc(IMP.nome)}</b><br>${IMP.itens.length} lançamentos · ${fmtData(ds[0])} a ${fmtData(ds[ds.length-1])} · saídas de ${brl0(sai)}</div>
   <div class="fld"><label for="iConta">De qual conta é este extrato?</label><select class="inp" id="iConta">${c.bancos.map(b=>`<option value="${esc(b.id)}" ${IMP.conta===b.id?"selected":""}>${esc(b.nome)}</option>`).join("")}</select></div>
   <p class="small muted" style="margin:0">Se este for o extrato da conta e você também importa o cartão, o pagamento da fatura entra como transferência para não contar duas vezes. Lançamentos já importados antes são ignorados. O que eu reconhecer pelas regras que você ensinou entra pronto; o resto vai para Classificar.</p>
   <button class="btn full" data-act="confirmar-import" id="btnImp">Importar ${IMP.itens.length} lançamentos</button>`;
}
async function confirmarImport(){
  const conta=$("#iConta").value; const btn=$("#btnImp"); btn.disabled=true;
  const cartao=/cartao/.test(conta); const vistos={}; let novos=0, prontos=0, i=0;
  const manuais=[...S.lanc.values()].filter(l=>l.origem==="manual"&&l.conta===conta);
  for(const it of IMP.itens){
    i++; btn.textContent=`Importando ${i} de ${IMP.itens.length}…`;
    const base=it.fitid?safeSeg(it.fitid):hash(it.data+"|"+it.valor+"|"+it.desc);
    vistos[base]=(vistos[base]||0)+1; const id=safeSeg("x-"+conta+"-"+base+(it.fitid?"":"-"+vistos[base]));
    if(S.lanc.has(id)) continue;
    const tipo=it.valor<0?"saida":"entrada"; const valor=Math.abs(it.valor);
    const k=chaveRegra(it.desc); const regra=k?S.regras.get(safeSeg(k.replace(/ /g,"-"))):null;
    let sug=null; const nd=norm(it.desc); for(const [re,mid] of KW){ if(re.test(nd)){ sug=mid; break; } }
    if(tipo==="entrada"&&(cartao||sug==="fatura")) sug="transf-entrada";
    if(tipo==="entrada"&&sug==="investimento") sug="resgate";
    if(sug&&tipo==="entrada"&&!["salario","transf-entrada","resgate"].includes(sug)) sug=null;
    if(sug&&tipo==="saida"&&sug==="salario") sug=null;
    const doc={data:it.data,mes:it.data.slice(0,7),valor,tipo,descricao:it.desc,conta,origem:"extrato",criadoEm:new Date().toISOString(),pessoa:"casa"};
    if(it.fitid) doc.fitid=it.fitid;
    if(regra&&MOT[regra.motivo]){ Object.assign(doc,finalizado({...doc,tipo},regra.motivo,regra.pessoa)); prontos++; }
    else { doc.status="pendente"; if(sug) doc.sugestao=sug;
      const dup=manuais.find(l=>Math.abs((+l.valor)-valor)<0.01&&Math.abs(new Date(l.data)-new Date(it.data))<=3*864e5);
      if(dup) doc.possivelDup=((MOT[dup.motivo]||{}).nome||"lançamento")+" em "+fmtData(dup.data);
    }
    try{ await Store.set("lanc",id,doc); novos++; }catch(e){ toast(e.message||"Parei no meio: tente importar de novo."); break; }
  }
  fecharSheet(); IMP=null;
  toast(novos?`${novos} importados${prontos?`, ${prontos} já classificados`:""}.`:"Nada novo nesse arquivo.");
  if(novos-prontos>0) location.hash="#classificar";
}

  const prompt=`Você ajuda um casal brasileiro a organizar as finanças da casa. Abaixo estão os números do mês, já classificados por eles (Essencial, Escolha, Evitável, Futuro). Escreva em português, tom direto e respeitoso, sem julgamento e sem jargão.

No máximo 140 palavras. Sem markdown, use apenas quebras de linha.

      try{ S.status=await run("salvarConexoes",p); toast("Conexões salvas. Verifico o banco a cada 10 minutos."); render(); }catch(err){ toast(String(err.message||err)); } b.disabled=false; break; }
    case "testar-whats": b.disabled=true; try{ await run("testarWhats"); toast("Mensagem enviada. Confira o WhatsApp."); }catch(err){ toast(String(err.message||err)); } b.disabled=false; break;
    case "sync-agora": b.disabled=true; b.textContent="Verificando…"; try{ const r=await run("sincronizar"); toast(r.ok?(r.novos?r.novos+" lançamentos novos.":"Nada novo no banco."):r.msg); const d=await run("tudo"); GasStore.aplicar(d); render(); }catch(err){ toast(String(err.message||err)); } break;
    case "trocar-pin": { const v=$("#novoPin").value.trim(); try{ await run("trocarPin",{novo:v}); PIN=v; try{localStorage.setItem("fc-pin",v);}catch(e){} toast("PIN trocado."); }catch(err){ toast(String(err.message||err)); } break; }
    case "meta-sel": lerCampos(); F.meta=F.meta===v?null:v; desenhaLanc(); break;
    case "guardar": { abrirLanc(null,"novo"); F.cat="futuro"; F.motivo="objetivo"; F.nat="F"; F.pessoa="casa"; F.meta=id||(metasOrd()[0]||{}).id||null; desenhaLanc(); setTimeout(()=>{const x=$("#fValor"); if(x) x.focus();},250); break; }
    case "nova-meta": abrirMeta(null); break;
    case "editar-meta": { const m=S.metas.get(id); if(m) abrirMeta({id,...m}); break; }
    case "meta-tipo": lerMeta(); MF.tipo=v; desenhaMeta(); break;
    case "salvar-meta": b.disabled=true; await salvarMeta(); b.disabled=false; break;
    case "apagar-meta": if(b.dataset.ok){ try{ await Store.del("metas",MF.id); fecharSheet(); toast("Sonho apagado."); }catch(err){toast("Não consegui apagar.");} } else { b.dataset.ok="1"; b.textContent="Toque de novo para apagar"; } break;
    case "cartao-sel": S.cartaoSel=b.dataset.f; render(); break;
    case "salvar-ajustes": b.disabled=true; await salvarAjustes(); b.disabled=false; break;
    case "ai": pedirPlano(); break;
    case "copiar-backup": { const data=JSON.stringify({lanc:Object.fromEntries(S.lanc),contas:Object.fromEntries(S.contas),regras:Object.fromEntries(S.regras),cfg:S.cfg}); try{ await navigator.clipboard.writeText(data); toast("Backup copiado. Cole num bloco de notas ou e-mail."); }catch(err){ toast("O navegador não deixou copiar."); } break; }
    case "limpar-regras": if(b.dataset.ok){ for(const k of [...S.regras.keys()]){ try{await Store.del("regras",k);}catch(err){} } toast("Regras apagadas."); } else { b.dataset.ok="1"; b.textContent="Toque de novo para confirmar"; } break;
  }
});
$("#fileInp").addEventListener("change",e=>{ const f=e.target.files&&e.target.files[0]; if(f) iniciarImport(f); });
$("#fab").addEventListener("click",()=>{ if(!S.podeEscrever){toast("Você pode ver, mas não editar.");return;} abrirLanc(null,"novo"); setTimeout(()=>{const v=$("#fValor"); if(v) v.focus();},250); });
$("#mPrev").addEventListener("click",()=>{S.mes=addMes(S.mes,-1);S.ai=null;render();});
$("#mNext").addEventListener("click",()=>{S.mes=addMes(S.mes,1);S.ai=null;render();});
function rota(){ const h=(location.hash||"").slice(1); if(h==="lancar"){ S.tab="painel"; render(); setTimeout(()=>{ abrirLanc(null,"novo"); const x=$("#fValor"); if(x) x.focus(); },400); return; } S.tab=["painel","sonhos","classificar","contas","cartao","extrato","ajustes"].includes(h)?h:"painel"; render(); window.scrollTo(0,0); }
window.addEventListener("hashchange",rota);
rota();
Store.init();
</script>
